<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechStore — Catálogo de Produtos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- HEADER -->
    <header>
        <div class="header-container">
            <div class="logo">Tech<span>Store</span></div>
            <div class="search-bar">
                <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                <input type="text" id="searchInput" placeholder="Buscar produtos, marcas, categorias..." />
            </div>
            <div class="header-icons">
                <!-- MENU DA CONTA -->
                <div class="user-dropdown">
                    <button class="header-icon" id="userIcon" type="button" title="Sua conta"
                            aria-label="Sua conta" aria-haspopup="true" aria-expanded="false">
                        <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-7 8-7s8 3 8 7"/></svg>
                    </button>
                    <div class="user-menu" id="userMenu" role="menu" aria-label="Opções da conta">
                        <div class="user-menu-head">
                            <div class="user-menu-title" id="userMenuTitle">Sua conta</div>
                            <div class="user-menu-sub" id="userMenuSub">Entre ou crie seu cadastro</div>
                        </div>
                        <a class="user-menu-item" id="linkEntrar" href="login.html" role="menuitem">
                            <svg viewBox="0 0 24 24"><path d="M15 3h4a2 2 0 012 2v14a2 2 0 01-2 2h-4M10 17l5-5-5-5M15 12H3"/></svg>
                            <span>Entrar</span>
                        </a>
                        <a class="user-menu-item" id="linkCadastro" href="cadastro.html" role="menuitem">
                            <svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></svg>
                            <span>Criar conta</span>
                        </a>
                        <a class="user-menu-item" id="linkPedidos" href="pedidos.html" role="menuitem" hidden>
                            <svg viewBox="0 0 24 24"><path d="M6 2h12l2 5H4l2-5zM4 7v13a1 1 0 001 1h14a1 1 0 001-1V7M9 11h6"/></svg>
                            <span>Meus pedidos</span>
                        </a>
                        <button class="user-menu-item" id="btnSair" type="button" role="menuitem" hidden>
                            <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg>
                            <span>Sair</span>
                        </button>
                    </div>
                </div>
                <div class="header-icon cart-icon" id="cartIcon" title="Carrinho">
                    <svg viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"/><circle cx="18" cy="21" r="1"/><path d="M2 2h3l2.5 13h12l2-8H6"/></svg>
                    <div class="cart-badge" id="cartBadge" style="display:none;">0</div>
                </div>
            </div>
        </div>
    </header>

    <!-- PILLS DE CATEGORIA -->
    <div class="pills-container" id="pillsContainer"></div>

    <!-- CONTEÚDO PRINCIPAL -->
    <div class="container">
        <!-- FILTROS -->
        <div class="filters-bar">
            <div class="filter-dropdown">
                <button class="filter-btn" id="ordenarBtn">
                    Ordenar por
                    <svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>
                </button>
                <div class="filter-menu" id="ordenarMenu">
                    <div class="filter-option" data-ordenar="relevancia">Relevância</div>
                    <div class="filter-option" data-ordenar="menor-preco">Menor Preço</div>
                    <div class="filter-option" data-ordenar="maior-preco">Maior Preço</div>
                    <div class="filter-option" data-ordenar="maior-desconto">Maior Desconto</div>
                </div>
            </div>
            <div class="filter-dropdown">
                <button class="filter-btn" id="marcaBtn">
                    Marca
                    <svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>
                </button>
                <div class="filter-menu" id="marcaMenu"></div>
            </div>
            <div class="filter-dropdown">
                <button class="filter-btn" id="precoBtn">
                    Faixa de Preço
                    <svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>
                </button>
                <div class="filter-menu" id="precoMenu">
                    <div class="filter-option" data-preco="todos">Todos os preços</div>
                    <div class="filter-option" data-preco="0-500">Até R$ 500</div>
                    <div class="filter-option" data-preco="500-1500">R$ 500 — R$ 1.500</div>
                    <div class="filter-option" data-preco="1500-5000">R$ 1.500 — R$ 5.000</div>
                    <div class="filter-option" data-preco="5000+">Acima de R$ 5.000</div>
                </div>
            </div>
        </div>

        <h2 class="section-title" id="sectionTitle">Catálogo Completo</h2>
        <div class="products-grid" id="productsGrid"></div>
    </div>

    <!-- CARRINHO DRAWER -->
    <div class="cart-overlay" id="cartOverlay"></div>
    <div class="cart-drawer" id="cartDrawer">
        <div class="cart-header">
            <div class="cart-title">Carrinho</div>
            <button class="cart-close" id="cartClose">
                <svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>
            </button>
        </div>
        <div class="cart-items" id="cartItems"></div>
        <div class="cart-footer">
            <div class="cart-subtotal-row">
                <span class="cart-subtotal-label">Subtotal</span>
                <span class="cart-subtotal-value" id="cartSubtotal">R$ 0,00</span>
            </div>
            <button class="cart-checkout-btn" id="checkoutBtn" disabled>Finalizar Compra</button>
        </div>
    </div>

    <!-- TOAST -->
    <div class="toast" id="toast"></div>

    <!-- NAV INFERIOR (MOBILE) -->
    <nav class="nav-bottom">
        <div class="nav-bottom-item active">
            <svg viewBox="0 0 24 24"><path d="M3 12l9-9 9 9M5 10v10h14V10"/></svg>
            <span>Início</span>
        </div>
        <div class="nav-bottom-item">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            <span>Buscar</span>
        </div>
        <div class="nav-bottom-item" id="navCartBtn">
            <svg viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"/><circle cx="18" cy="21" r="1"/><path d="M2 2h3l2.5 13h12l2-8H6"/></svg>
            <span>Carrinho</span>
        </div>
        <div class="nav-bottom-item" id="navPerfilBtn">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-7 8-7s8 3 8 7"/></svg>
            <span>Perfil</span>
        </div>
    </nav>

    <script src="script.js"></script>
</body>
</html>
